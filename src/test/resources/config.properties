# =====================================================================
#  Unified Test Framework Configuration
#  Owner: Srinivasan Pidugu Jothi
#  Version: 1.3
#  Last-Updated: 2025-10-06
#  Notes:
#    - Do NOT commit real secrets. Reference env vars or a secrets manager.
#    - Values surrounded by ${...} are expected to come from environment
#      variables or your secrets provider at runtime.
# =====================================================================


# ==========================
#  Browser Configuration
# ==========================
# Default browser to launch (chrome | firefox | edge | safari | safari-tp)
browser=chrome
chrome.browser.arguments=--start-maximized,--incognito,--disable-popup-blocking
headless.mode=false
# Arguments to apply when headless mode is active
# Note: --disable-gpu is a no-op on many platforms but harmless.
headless.arguments=--headless=new,--disable-gpu,--window-size=1920,1080
# Firefox-specific window dimensions
firefox.browser.arguments=--width=1920,--height=1080
# Edge-specific arguments
edge.browser.arguments=--start-maximized
# Safari (macOS only)
# Flip to true when you want Web Inspector / performance profiling.
safari.automaticInspection=false
safari.automaticProfiling=false
# ==========================
#  Execution Infrastructure
# ==========================
# Run tests remotely (Selenium Grid, Selenoid, cloud provider)
remote.execution=false
# Selenium Grid URL.
# For Selenium 4 Grid use base URL WITHOUT /wd/hub; add /wd/hub only for Selenium 3.
remote.url=http://localhost:4444
# Optional: Max concurrent sessions when runner supports it
#execution.max.concurrency=5


# ==========================
#  Test Data Configuration
# ==========================
# Path to your Excel file used for all test data
Test_Data_File_Path=src/test/resources/POC_data_sheet_v1.1.xlsx
# Sheet names inside the Excel file
Login_Data_Sheet_Name=Common_TestData
Synthetic_Data_Sheet_Name=Synthetic_Data
Transactional_Data_Sheet_Name=Transactional_Data
End_To_End_Sheet_Name=E2E Binding


# ==========================
#  Test Classification
# ==========================
# Test type by groups (method-level @Test groups)
testtype.group.system=system
testtype.group.e2e=e2e
# Test type by package prefix (comma-separated, *no trailing dot needed*)
testtype.system.packages=com.MyridiusUAF.SystemTest, com.company.project.sys.tests
testtype.e2e.packages=com.MyridiusUAF.EndToEnd, com.company.project.e2e


# ==========================
#  Email SMTP Configuration
# ==========================
# Switch between gmail | outlook
smtp.provider=gmail
smtp.fallback.ports=465,25,587
# Security: never commit credentials. Use env vars or a vault.
# For Gmail/Google Workspace, prefer an App Password or OAuth2 access token.
smtp.username=
smtp.password=
email.display.name=Myridius Unified Framework
email.subject=Myridius Unified Framework - Test Execution Report
email.body.projectName=Myridius Unified Framework
# Use a team/service mailbox & DLs, not personal addresses
email.from=
email.to=
email.cc=
email.bcc=
# Layout controls
# center | left
email.layout.align=left
# page padding
email.layout.bodyPadding=20px
# Button behavior:
# If empty -> clients may download attachment (where allowed); if set -> open URL in new tab
# Example: https://artifacts.example.com/reports/{file}
email.report.url=
email.logo.path=assets/email/logo.png


# =======
#  JIRA
# =======
jira.url=
jira.email=
jira.api.token=
jira.project.key=KAN
jira.issue.type=Task
jira.issue.labels=automation,ui
jira.debug.links.comment=false
jira.exec.write.enabled=false


# ==========================
#  Video Recording
# ==========================
recording.enabled=true
# per_test or per_run
recording.mode=per_test
# ffmpeg binary; leave as ffmpeg if it's on PATH
recording.ffmpeg.path=C:\\Users\\SPidugujothi\\scoop\\apps\\ffmpeg\\current\\bin\\ffmpeg.exe
recording.output.dir=Recordings
# encoding knobs
recording.fps=15
recording.preset=veryfast
recording.crf=28
# capture scope: screen or (experimental) window
recording.capture=screen
# for mac: which screen index to capture (0/1/2...), default 1 is main display on many setups
recording.macos.screen.index=1
# linux X11 display
recording.linux.display=:0.0
# stop wait timeout (ms) when finalizing the mp4
recording.stop.timeout.ms=6000


# ==========================
#  AI Feature Switches
# ==========================
ai.selfhealing.enabled=true
ai.healing.use.llm=true
# AI data generation (falls back to deterministic fakes when off)
ai.datagen.enabled=true
# AI test authoring CLI guard (informational; CLI can check and exit)
ai.authoring.enabled=true
# Global OpenAI toggle (in addition to env OPENAI_API_KEY)
# When false, all code that tries to create an OpenAiClient will skip it.
ai.openai.enabled=true
# How long JiraListener waits for AiTriage .md (milliseconds)
ai.triage.enabled=true
jira.ai.triage.await.ms=90000
ai.triage.log.md.to.console=false


# Credentials (prefer environment variables in CI)
odoo.user.email=
odoo.user.password=

# ===== Data wiring (reuses your Excel) =====
POS_Data_File_Path=src/test/resources/testdata/POC_data_sheet_v1.1.xlsx
POS_Data_Sheet_Name=Odoo_POS
odoo.pos.items=Water,Coca-Cola,Espresso,Green Tea
odoo.payment.method=Cash

# ===== Optional toggles =====
odoo.headless=false

# --------------------------
# Data backend (Excel|Database)
data-driven=Excel

# --------------------------
# MySQL settings (used only when data-driven=Database)
db.url=jdbc:mysql://localhost:3306/myridius_uaf?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.user=${MYSQL_USER}
db.password.base64=${MYSQL_PASSWORD_B64}
db.pool.max=5
# <- stop applying schema.sql on startup
# creates tables if missing on first use
db.autoCreate=false
db.log.sql=false          # set true to log queries for debugging

# --- Migration control (used only when data-driven=Database) ---
db.migrate.on.start=false        # set true only when you WANT to re-seed
db.migrate.strategy=once         # once | always | delta

# ==========================
#  OpenAI Configuration
# ==========================

# Use env vars to avoid committing secrets
openai.apiKey=${OPENAI_API_KEY}

# Optional overrides (safe defaults can exist in code)
openai.baseUrl=https://api.openai.com

# (only works if your project/key has access)S
openai.model=
# (safe fallback; used automatically when the model is blocked)
openai.fallbackModel=
openai.timeoutSeconds=60
